name: volumn_controller
description: "A lightweight Android volume controller with persistent notification and home-screen widgets."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png

# Android launcher icon configuration
flutter_launcher_icons:
  android: true
  image_path: assets/branding/logo.png
  adaptive_icon_background: "#050D34"
  adaptive_icon_foreground: assets/branding/logo.png
  min_sdk_android: 21

# Native splash screen configuration
flutter_native_splash:
  color: "#050D34"
  image: assets/branding/logo.png
  android: true
  ios: false
  web: false
  fullscreen: false

  android_12:
    color: "#050D34"
    image: assets/branding/logo.png
    icon_background_color: "#050D34"